# 后台的全部配置。改完刷新 /admin/ 就生效，不用重新构建。
# 字段和 src/content.config.ts 里的 schema 必须对得上 ——
# 这边写错了，后台照样让你保存，然后构建时才报错。改完记得本地跑一次 npm run build。

backend:
  name: github
  repo: Zssusin/Write-a-novel-for-the-future
  # Cloudflare 构建的是 main。写错分支 = 存进去了但永远不上线。
  branch: main
  # 故意没有 base_url。
  #
  # 登录走「Sign In with Token」——粘一个 GitHub fine-grained PAT 就行，
  # 不需要 OAuth App，也不需要自己部署中转 Worker。见 docs/后台发布.md。
  #
  # 之所以选这条：只有你一个人用这个后台。OAuth App 拿到的 token 覆盖你账号下
  # 所有仓库且收不窄；fine-grained PAT 能锁死在这一个仓库、只给 Contents 读写。
  # 哪天要让不懂技术的人也来写稿，再回去补 OAuth 那条路。

# 后台里「查看线上页面」按钮用的地址。
# 以后绑了自己的域名，这里和 astro-paper.config.ts 里的 url 要一起改。
site_url: https://clarkebelt.org

# 全站兜底的媒体位置。文章**不走这里** —— posts 那个集合自己覆盖了
# media_folder（见下面的 collections），图片跟着文章走。
# 这一份只服务于 pages（关于页之类），以及资源库页面里的散图。
media_folder: public/images
public_folder: /images

media_libraries:
  # 上传前处理。这一段对所有上传目标生效，不需要任何凭证。
  default:
    config:
      # 浏览器里直接转码，压完再传 —— 也就是说 docs/图片工作流.md 第 4 节那条
      # sharp-cli 命令，用后台上传的话不用跑了。
      #
      # 输出格式只有 webp 一个选项：代码里的白名单就一项（`uM=["webp"]`），
      # 填别的会被静默改成 webp。能被转换的输入是 avif/gif/jpeg/png/webp，
      # 其它（比如 HEIC）原样上传，不会报错但也不会被压。
      transformations:
        raster_image:
          format: webp
          quality: 82
          # 最长边。正文图 1600 够用；封面缩略图桌面端只有 176×112，
          # 传大了也是浪费，但一张图两用，就按大的来。
          width: 1600
      # 转换之后才判断大小，所以这不是「原图不能超过多少」，
      # 而是「压完还这么大就有问题」。正常一张 1600px webp 在 200KB 上下。
      max_file_size: 1500000
      # 中文文件名会变成一串百分号编码的对象名。转成短横线拼音/英文。
      slugify_filename: true

  # ── Cloudflare R2 直传：2026-08-26 撤掉 ────────────────────────────
  #
  # 撤的原因不是它不能用（能用，验证过），是**它多了一个选择**。
  # 有两个上传目标，每次插图就得先想「这张该进哪个」；选错了不会当场报错，
  # 而是过一会儿构建才炸，或者悄悄丢掉尺寸信息。
  #
  # 现在只剩仓库这一个目标，图片进 src/content/posts/img/，
  # 剩下的 Astro 全包了（尺寸、缩略图、内容哈希）。
  # 代价是图片进 git —— 迁过来的 19 张一共 1.2 MB，这个量级不值得为它
  # 维护第二条路。真涨到几百兆再回来看这段。
  #
  # 桶和 worker 都**没动**，https://clarkebelt.org/img/... 的老地址照常能开。
  # 要恢复直传：git log -- public/admin/config.yml 里翻这一段回来。

collections:
  - name: posts
    label: 文章
    label_singular: 文章
    folder: src/content/posts
    create: true
    # ===== 图片跟着文章走 =====
    #
    # 相对路径（不以 / 开头）在 Sveltia 里是**相对 collection 的 folder** 解析的，
    # 所以 `img` = src/content/posts/img/，正好落在文章旁边。
    #
    # 为什么非要落在 src/ 底下：只有 src/ 里的图 Astro 才当成「本地资源」——
    # 构建时它会自己量尺寸、写进 <img> 的 width/height、按用途生成缩略图、
    # 给文件名加内容哈希。放 public/ 或者外链都拿不到这一套，
    # 得靠文件名里手写 `-宽x高` 去补（那是 2026-08 之前的老办法，已经废掉）。
    #
    # public_folder 写成 ./img，正文里就是 `![](./img/foo.webp)`。
    # 省掉它的话 Sveltia 会拿 media_folder 的值兜底、写成 `img/foo.webp` ——
    # 实测 Astro 两种都认，所以这里写不写都不会坏，写全只是为了读起来明确。
    media_folder: img
    public_folder: ./img
    # 文件名 = URL。取自下面那个 slug 字段，而不是标题 ——
    # 标题是中文，直接拿来做文件名会得到一串百分号编码。
    slug: "{{fields.slug}}"
    extension: md
    format: yaml-frontmatter
    identifier_field: title
    summary: "{{title}}"
    sortable_fields: [pubDatetime, title]
    view_filters:
      - { label: 只看草稿, field: draft, pattern: true }
      - { label: 只看已发布, field: draft, pattern: false }
    fields:
      - label: 文件名
        name: slug
        widget: string
        hint: 决定网址，只用小写英文和短横线。发出去之后就别再改了——改了外链和收藏会全断。
        pattern:
          - "^[a-z0-9]+(-[a-z0-9]+)*$"
          - 只能用小写英文字母、数字和短横线，比如 dyson-sphere-1

      # 永久标识。浏览器里跑不了 npm run uid，所以让后台自己生成。
      # uuid 组件在「新建条目」那一刻生成一次，之后不可修改 —— 正是 uid 要的性质。
      # prefix: u 让首位是字母，纯数字被 YAML 读成数字的坑就不存在。
      - label: 永久标识
        name: uid
        widget: uuid
        prefix: u
        use_b32_encoding: true
        hint: 自动生成，用来给以后的评论和浏览量当锚点。别动它。

      - label: 标题
        name: title
        widget: string

      - label: 摘要
        name: description
        widget: text
        hint: 一两句话。会显示在列表、搜索结果和分享卡片上，别留空。

      - label: 发布时间
        name: pubDatetime
        widget: datetime
        # 存成带时区偏移的 ISO 形状，和现有文章一致
        format: YYYY-MM-DDTHH:mm:ssZ
        date_format: YYYY-MM-DD
        time_format: HH:mm
        hint: 别填未来的时间——静态站不会自己到点更新，填了未来时间这篇就直接不生成。

      - label: 修改时间
        name: modDatetime
        widget: datetime
        required: false
        format: YYYY-MM-DDTHH:mm:ssZ
        date_format: YYYY-MM-DD
        time_format: HH:mm
        hint: 改过旧文章才填，新文章留空。

      - label: 标签
        name: tags
        widget: list
        default: [现实科技]
        field: { label: 标签, name: tag, widget: string }
        hint: 栏目就是标签。四个栏目：现实科技 / 原创故事 / 工具箱 / 书目推荐。可以再加别的。

      - label: 首页精选
        name: featured
        widget: boolean
        required: false
        default: false

      - label: 草稿
        name: draft
        widget: boolean
        required: false
        default: false
        hint: 勾上就不会出现在站上——本地 npm run dev 里也看不到，草稿是无条件隐藏的。

      # widget: image 才有媒体库按钮（能直接拖图上传）。
      #
      # 这里**不要**写 media_libraries: { default: false }。
      # 实测过：字段级的 false 会把上面那整段 default.config 一起干掉 ——
      # 自动转 webp、slugify_filename、max_file_size 全失效。原因在
      # Sveltia 的代码里，字段级配置命中 false 就直接 return，
      # 后面取 transformations 时是从 {} 里取的，什么都拿不到。
      # （历史上这里有一大段关于「仓库 vs R2 两个来源怎么选」的说明。
      #   R2 那条路 2026-08-26 撤了，只剩一个上传目标，那个坑不复存在。）
      - label: 配图
        name: ogImage
        widget: image
        required: false
        hint: >-
          首页/归档列表的缩略图，同时也是分享卡片的图。点按钮上传就行 ——
          存进去是 ./img/xxx.webp，构建时 Astro 自己量尺寸、自己出缩略图。
          上传时自动转 webp、压到 1600px 宽，不用自己先压。留空就是纯文字卡片。

      # 不填时 Sveltia 可能写出 series: null 而不是省掉这个键，
      # 所以 schema 那边是 .optional().nullable()，校验脚本也认 null。
      - label: 连载系列
        name: series
        widget: object
        required: false
        collapsed: auto
        hint: 一个主题拆成多部分陆续发时才填。不是连载就整块留空。
        fields:
          - label: 系列名
            name: name
            widget: string
            hint: 同一系列每篇必须一字不差，差一个字就成了两个系列。
          - label: 第几部分
            name: part
            widget: number
            value_type: int
            min: 1
            hint: 决定阅读顺序，和发布时间无关。允许跳号。

      - label: 原文出处
        name: source
        widget: object
        required: false
        collapsed: auto
        hint: 译文必须填。原创文章整块留空。
        fields:
          - { label: 原文标题, name: title, widget: string }
          - { label: 原作者, name: author, widget: string, required: false }
          - label: 原文链接
            name: url
            widget: string
            pattern: ["^https?://", 要完整的 http(s) 地址]
          - label: 授权说明
            name: note
            widget: string
            required: false
            hint: 怎么措辞由你定，比如「已获原作者邮件授权翻译」。

      # modes 的默认值是 [rich_text, raw] —— 富文本在前，于是编辑器每次打开
      # 都是富文本模式，保存时整篇正文要走一趟「markdown → 富文本树 → markdown」。
      # docs/后台发布.md 第 4 节那个「会反复回来」的坑就出在这个来回上：
      # `**[链接](...)**` 的星号被转义成 `\*\*`，成对的 `**` 还会被吞掉一半
      # （2026-08-26 在 project-to-the-stars 上两处都撞见了）。
      #
      # 把 raw 放到第一位，编辑器默认就开在 Markdown 源码模式 —— 0.172.4 和
      # 0.200.0 的源码里 useRichText 取的都是 `modes[0] === 'rich-text'`，富文本的
      # 序列化器于是根本不会碰正文。那一节写的规避办法（「切到 Markdown
      # 源码模式再改」）本来就是这个，只是原来每次要手动切，现在是默认。
      #
      # 保留 rich_text 是为了留着工具栏那条路 —— modes 多于一项才会出现
      # 切换按钮。想彻底堵死就写成 modes: [raw]，代价是再也用不了富文本。
      - label: 正文
        name: body
        widget: markdown
        modes: [raw, rich_text]

  - name: pages
    label: 单页
    label_singular: 单页
    # 单页只改不建，所以用 files 逐个列出，不给「新建」按钮
    files:
      - name: about
        label: 关于
        file: src/content/pages/about.md
        fields:
          - { label: 标题, name: title, widget: string }
          - { label: 摘要, name: description, widget: text, required: false }
          # 同上：默认开在 Markdown 源码模式，别让富文本序列化器碰正文。
          - label: 正文
            name: body
            widget: markdown
            modes: [raw, rich_text]
